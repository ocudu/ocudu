# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Repo config; overrides the org-level UI settings for this repo.

inheritance: true
language: en-US
tone_instructions: "Terse and technical; no praise or emojis. Withdraw a finding on counter-evidence (code, config, spec) or if you can't back it; else restate yours. In threads, reply only to add information or confirm a fix; never offer issues or unavailable features."

reviews:
  profile: chill
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  review_status: false
  review_info: false
  review_details: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  commit_status: true
  fail_commit_status: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords: ["WIP", "[skip review]"]

  path_filters:
    - "!external/**"
    - "!lib/asn1/*/**"
    - "!include/ocudu/asn1/*/**"
    - "!**/*.pcap"
    - "!**/*.bin"
    - "!**/*_test_data.h"
    - "!**/*.tar.gz"

  path_instructions:
    - path: "**"
      instructions: |
        Use Major only for issues reachable in the configuration or build actually used; if an issue depends on a non-default setting, mark it Minor and name that setting.
    - path: "**/*.{h,cpp}"
      instructions: |
        Check every hunk against the configured code guidelines.
        Apply style and convention rules only to code the diff adds or changes. Flag bugs in unchanged code only when the change makes them reachable.
        Report a finding only with a concrete failure scenario (inputs or state leading to the wrong outcome); drop speculative ones.
        Rank memory safety, untrusted input and real-time issues above general correctness, and conventions last.
        Skip stylistic nits that match no checklist item; clang-format and clang-tidy run in CI.
        Do not comment on code-format (clang-format) job failures; the author runs clang-format.
    - path: "lib/{phy,ofh,hal}/**"
      instructions: |
        Check SIMD/vector code for alignment and tail handling, and fixed-point/float scaling against 3GPP TS 38.211/38.212.
    - path: "lib/{cu_cp,cu_up,rrc,ngap,f1ap,e1ap,xnap}/**"
      instructions: |
        Check procedures against the 3GPP spec: transaction IDs, timers, cause values, and cleanup on failure or cancellation of async tasks.
    - path: "tests/**"
      instructions: |
        Focus on whether the test exercises the intended branch and whether assertions can pass trivially. Do not ask for more tests on test code.
    - path: ".gitlab/**"
      instructions: |
        GitLab CI. Check rules/needs/extends correctness and that jobs still run on the intended pipelines (MR, merge train, schedules).
    - path: "docker/**"
      instructions: |
        Check image size, layer caching, pinned versions, and that build flags match the CMake options used in CI.

  tools:
    # CI already runs clang-format/clang-tidy; these add separate analyzers.
    clang:
      enabled: true
    cppcheck:
      enabled: true
    fbinfer:
      enabled: false
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    hadolint:
      enabled: true
    gitleaks:
      enabled: true
    languagetool:
      enabled: false

  finishing_touches:
    autofix:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    docstrings:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: "MR scope and size"
        mode: warning
        instructions: |
          Count changed lines (added + removed), ignoring generated ASN.1 codecs under lib/asn1/*/ and include/ocudu/asn1/*/, and files under external/.
          Group changed non-test files into areas: each lib/<dir> together with include/ocudu/<dir>, plus apps/, cmake and CMakeLists.txt, .gitlab/, docker/, configs/.

          Fail if either holds:
          1. More than 1000 changed lines (size/XXL).
          2. Three or more areas have substantive changes. Changes limited to call-site updates for an API change, include fixes, renames or build-file wiring do not count as substantive.

          On failure, propose a split into smaller MRs in dependency order, one line each: title and the files or areas it would contain.
          Otherwise pass.

chat:
  art: false
  auto_reply: true
  allow_non_org_members: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "docs/agents/**/*.md"
      - files: "ocudu_tools:skills/ocudu-code-review/references/*.md"
        applyTo: "**/*.h,**/*.cpp"
      - files: "ocudu_docs:docs/dev_guide/code_guide/*.md"
        applyTo: "**/*.h,**/*.cpp"
      - files: "ocudu_docs:docs/dev_guide/architecture_guide/3_realization/*.md"
        applyTo: "lib/**,include/**,apps/**"
      - files: "ocudu_docs:docs/dev_guide/logging_guide/index.md"
        applyTo: "lib/**,apps/**"
      - files: "ocudu_docs:docs/dev_guide/testing_policy/index.md"
        applyTo: "tests/**"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
