.version increased:
  stage: ci
  image:
    name: alpine/git:v2.49.1
    entrypoint: ["/bin/sh", "-c"]
  variables:
    FILE_PATH: ""
    VARIABLE_NAME: ""
  script:
    - |
      # Pipeline-fixed base, so retries after a rebase compare the same revisions
      BASE_SHA=$CI_MERGE_REQUEST_DIFF_BASE_SHA
      git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --depth=1 origin "$BASE_SHA"
      NEW_VERSION=$(grep "$VARIABLE_NAME" "$FILE_PATH" | cut -d'"' -f2)
      if ! OLD_FILE=$(git show "$BASE_SHA:$FILE_PATH" 2>/dev/null) || \
         ! printf '%s\n' "$OLD_FILE" | grep -q "$VARIABLE_NAME"; then
        echo "$VARIABLE_NAME not present at base $BASE_SHA, nothing to compare."
        exit 0
      fi
      OLD_VERSION=$(printf '%s\n' "$OLD_FILE" | grep "$VARIABLE_NAME" | cut -d'"' -f2)
      echo "OLD version: $OLD_VERSION -- NEW version: $NEW_VERSION"
    - |
      if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
          echo "ERROR: Version not changed."
          exit 1
      elif [ "$(printf '%s\n' "$OLD_VERSION" "$NEW_VERSION" | sort -V | tail -1)" != "$NEW_VERSION" ]; then
          echo "ERROR: Version decreased."
          exit 1
      fi
      echo "Version increased correctly."
