include:
  - local: .gitlab/ci-shared/docker.yml

stages:
  - publish

rh-tool-cli build-and-publish:
  stage: publish
  extends: .docker-builder
  image: ${CI_REGISTRY_IMAGE}/buildkit-cli:latest
  artifacts: null
  rules:
    - if: $ON_MR
    - if: $ON_WEB
    - if: $ON_API
    - if: $ON_MAIN
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Nightly/
  variables: &image_variables
    NAME: rh-tool-cli
    CONTEXT: .gitlab/ci/rh-tool-cli
    VERSION: ${RH_TOOL_CLI_VERSION}
    BUILD_ARGS: "BUILDKIT_CLI_VERSION=${BUILDKIT_CLI_VERSION};PREFLIGHT_VERSION=${PREFLIGHT_VERSION}"
    MULTI_ARCH_BUILD: "true"
    MODE: publish
    PREFLIGHT_VERSION: "1.19.1"
    CONTAINER_SECURITY_ANALYSIS_SKIP: "true"
  parallel:
    matrix:
      - PLATFORM: ["arm64", "amd64"]

rh-tool-cli manifest:
  extends: .docker manifest
  image: ${CI_REGISTRY_IMAGE}/buildkit-cli:latest
  variables:
    <<: *image_variables
  rules:
    - if: $ON_MR
    - if: $ON_WEB
    - if: $ON_API
    - if: $ON_MAIN
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Nightly/
  needs:
    - job: rh-tool-cli build-and-publish
      optional: false

rh-tool-cli manifest latest:
  extends: rh-tool-cli manifest
  script:
    - |
      docker manifest create \
        ${CI_REGISTRY_IMAGE}/${NAME}:latest \
        --amend ${CI_REGISTRY_IMAGE}/${NAME}:${VERSION}-amd64 \
        --amend ${CI_REGISTRY_IMAGE}/${NAME}:${VERSION}-arm64
      docker manifest push ${CI_REGISTRY_IMAGE}/${NAME}:latest
