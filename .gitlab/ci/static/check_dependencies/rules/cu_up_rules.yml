# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
rules:
  - id: cu_up-must-not-depend-on-cu_cp
    kind: forbidden-edge
    from:
      - include/ocudu/cu_up/**
      - lib/cu_up/**
    to:
      - include/ocudu/cu_cp/**
      - lib/cu_cp/**
    reason: CU-CP and CU-UP are separate network functions that talk over E1 only, and may run in different
      processes.
  - id: cu_up-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/cu_up/**
      - lib/cu_up/**
    allow:
      - include/ocudu/adt/**
      - include/ocudu/cu_up/**
      - include/ocudu/e1ap/common/**
      - include/ocudu/e1ap/cu_up/**
      - include/ocudu/e1ap/gateways/*.h
      - include/ocudu/f1u/cu_up/**
      - include/ocudu/gateways/**
      - include/ocudu/gtpu/**
      - include/ocudu/ocudulog/**
      - include/ocudu/pdcp/**
      - include/ocudu/pcap/**
      - include/ocudu/ran/**
      - include/ocudu/rohc/**
      - include/ocudu/sdap/**
      - include/ocudu/support/**
      - lib/cu_up/**
    extra_allow_for_prefix:
      - prefix: o_
        allow:
          - include/ocudu/e2/**
      - prefix: e1_setup_e2_adapter
        allow:
          - include/ocudu/e2/**
    reason: Module CU-UP may only depend on the modules listed in allow; anything else breaks its layering boundary.
