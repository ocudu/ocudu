# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
rules:
  - id: du-hi-must-not-depend-on-phy
    kind: forbidden-edge
    from:
      - include/ocudu/mac/**
      - lib/mac/**
      - include/ocudu/scheduler/**
      - lib/scheduler/**
      - include/ocudu/rlc/**
      - lib/rlc/**
    to:
      - include/ocudu/phy/**
      - lib/phy/**
      - include/ocudu/fapi/**
      - include/ocudu/fapi_adaptor/**
      - lib/fapi_adaptor/**
    reason: DU High is wired to DU low by the application, through interfaces DU high defines itself. Including DU low,
      FAPI or adaptor headers ties DU high to one DU low implementation and breaks the split-6 and split-7.2
      deployments.
