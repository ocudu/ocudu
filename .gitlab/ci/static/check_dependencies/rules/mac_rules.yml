# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
rules:
  - id: mac-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/mac/**
      - lib/mac/**
    allow:
      - include/ocudu/adt/**
      - include/ocudu/instrumentation/**
      - include/ocudu/mac/**
      - include/ocudu/ocudulog/**
      - include/ocudu/pcap/**
      - include/ocudu/ran/**
      - include/ocudu/scheduler/**
      - include/ocudu/support/**
      - lib/mac/**
    reason: Module MAC may only depend on the modules listed in allow; anything else breaks its layering boundary.
