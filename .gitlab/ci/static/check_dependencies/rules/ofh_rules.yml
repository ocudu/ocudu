# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
rules:
  - id: fronthaul-must-not-depend-on-l2
    kind: forbidden-edge
    from:
      - include/ocudu/ofh/**
      - lib/ofh/**
      - include/ocudu/fapi/**
    to:
      - include/ocudu/mac/**
      - lib/mac/**
      - include/ocudu/scheduler/**
      - lib/scheduler/**
      - include/ocudu/rlc/**
      - lib/rlc/**
      - include/ocudu/pdcp/**
      - lib/pdcp/**
      - include/ocudu/fapi_adaptor/**
      - lib/fapi_adaptor/**
    reason: The fronthaul and FAPI interfaces carry L1 data only. Including L2 or adaptor headers gives
      them knowledge of layers on the far side of the interface they define.
