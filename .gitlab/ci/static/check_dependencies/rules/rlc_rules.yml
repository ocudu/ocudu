# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
rules:
  - id: rlc-must-not-depend-on-adjacent-layers
    kind: forbidden-edge
    from:
      - include/ocudu/rlc/**
      - lib/rlc/**
    to:
      - include/ocudu/mac/**
      - lib/mac/**
      - include/ocudu/pdcp/**
      - lib/pdcp/**
    reason: RLC exchanges SDUs with MAC and PDCP through interfaces it defines itself, so it must not
      see either neighbour's types.
