# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
rules:
  - id: ru-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/ru/*.h
    allow:
      - include/ocudu/adt/**
      - include/ocudu/instrumentation/**
      - include/ocudu/ocudulog/**
      - include/ocudu/ofh/**
      - include/ocudu/phy/support/**
      - include/ocudu/phy/upper/**
      - include/ocudu/ran/**
      - include/ocudu/ru/*.h
      - include/ocudu/support/**
    extra_allow_for_prefix:
      - prefix: ru_metrics
        allow:
          - include/ocudu/ru/dummy/ru_dummy_metrics.h
          - include/ocudu/ru/sdr/ru_sdr_metrics.h
    reason: Module RU may only depend on the modules listed in allow; anything else breaks its layering boundary.
  - id: ru-dummy-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/ru/dummy/**
      - lib/ru/dummy/**
    allow:
      - include/ocudu/adt/**
      - include/ocudu/ocudulog/**
      - include/ocudu/phy/support/**
      - include/ocudu/ran/**
      - include/ocudu/ru/*.h
      - include/ocudu/ru/dummy/**
      - include/ocudu/support/**
      - lib/ru/dummy/**
    reason: Module RU dummy may only depend on the modules listed in allow; anything else breaks its layering boundary.
  - id: ru-ofh-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/ru/ofh/**
      - lib/ru/ofh/**
    allow:
      - include/ocudu/adt/**
      - include/ocudu/ocudulog/**
      - include/ocudu/ofh/**
      - include/ocudu/phy/support/**
      - include/ocudu/ran/**
      - include/ocudu/ru/*.h
      - include/ocudu/ru/ofh/**
      - include/ocudu/support/**
      - lib/ru/ofh/**
    reason: Module RU OFH may only depend on the modules listed in allow; anything else breaks its layering boundary.
  - id: ru-sdr-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/ru/sdr/**
      - lib/ru/sdr/**
    allow:
      - include/ocudu/adt/**
      - include/ocudu/gateways/baseband/**
      - include/ocudu/instrumentation/**
      - include/ocudu/ocudulog/**
      - include/ocudu/phy/lower/**
      - include/ocudu/phy/support/**
      - include/ocudu/radio/**
      - include/ocudu/ran/**
      - include/ocudu/ru/*.h
      - include/ocudu/ru/sdr/**
      - include/ocudu/support/**
      - lib/ru/sdr/**
    reason: Module RU SDR may only depend on the modules listed in allow; anything else breaks its layering boundary.
