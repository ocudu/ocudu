# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
always_allowed:
  - external/Backward/**
  - external/CLI/**
  - external/TartanLlama/**
  - external/cameron314/**
  - external/fmt/**
  - external/nlohmann/**
  - external/rigtorp/**
  - external/uWebSockets/**
rules:
  # Top level checks (lib, include, apps, tests).
  - id: public-headers-must-not-include-private
    kind: forbidden-edge
    from: include/**
    to: lib/**
    reason: A public header that pulls in an implementation header exports private types to every consumer
      and makes the private header impossible to change without breaking external code.
  - id: subsystem-private-headers-are-private
    kind: peer-isolation
    peers: lib/*
    reason: Subsystems interact only through their public headers under include/ocudu/. Reaching into
      a sibling subsystem's lib/ directory couples to implementation details and blocks refactoring either
      side independently.
  - id: production-must-not-include-tests-or-apps
    kind: forbidden-edge
    from:
      - include/**
      - lib/**
    to:
      - apps/**
      - tests/**
    reason: 'Library code depending on test fixtures or application wiring inverts the build graph: the
      library can no longer be built or shipped on its own.'
  - id: apps-must-not-depend-on-tests
    kind: forbidden-edge
    from: apps/**
    to: tests/**
    reason: 'Shipped applications must not include test fixtures or doubles: it drags test-only code into
      the release build and makes the app unbuildable when testing is disabled.'
  - id: apps-must-use-public-headers
    kind: forbidden-edge
    from: apps/**
    to: lib/**
    reason: Applications compose subsystems through their public interfaces under include/ocudu/. Reaching
      into lib/ pins an app to one subsystem's internal layout.
  - id: adt-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/adt/**
    allow:
      - include/ocudu/adt/**
      - include/ocudu/ocudulog/**
      - include/ocudu/support/**
    reason: Module adt may only depend on the modules listed in allow; anything else breaks its layering
      boundary.
  - id: asn1-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/asn1/**
      - lib/asn1/**
    allow:
      - include/ocudu/asn1/**
      - lib/asn1/**
      - include/ocudu/adt/**
      - include/ocudu/ocudulog/**
      - include/ocudu/support/**
    reason: Module asn1 may only depend on the modules listed in allow; anything else breaks its layering
      boundary.
  - id: ocudulog-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/ocudulog/**
      - lib/ocudulog/**
    allow:
      - include/ocudu/ocudulog/**
      - lib/ocudulog/**
    reason: Module ocudulog may only depend on the modules listed in allow; anything else breaks its layering
      boundary.
  - id: ran-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/ran/**
      - lib/ran/**
    allow:
      - include/ocudu/ran/**
      - lib/ran/**
      - include/ocudu/adt/**
      - include/ocudu/ocudulog/**
      - include/ocudu/ocuduvec/**
      - include/ocudu/support/**
    reason: Module ran may only depend on the modules listed in allow; anything else breaks its layering
      boundary.
    exempt:
      - from: include/ocudu/ran/cu_types.h
        to: include/ocudu/sdap/sdap_config.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. QoS flow types in ran/ carry
          an SDAP config field; splitting it out needs a shared QoS header.
      - from: include/ocudu/ran/inter_cu_handover_messages.h
        to: include/ocudu/security/security.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. Handover request messages embed
          the security context; moving it needs a ran-level security type.
      - from: include/ocudu/ran/pdcch/search_space.h
        to: include/ocudu/scheduler/sched_consts.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. Search space uses a scheduler
          constant that belongs in ran/.
  - id: public-headers-must-not-use-relative-includes
    kind: no-relative-includes
    from: include/**
    reason: A public header using a relative '..' include ties its resolution to its own location in the
      tree, rather than to the stable public path other code depends on.
  - id: support-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/support/**
      - lib/support/**
    allow:
      - include/ocudu/support/**
      - lib/support/**
      - include/ocudu/adt/**
      - include/ocudu/ocudulog/**
      - include/ocudu/ocuduvec/**
    reason: Module support may only depend on the modules listed in allow; anything else breaks its layering
      boundary.
  # Per-component checks (e.g. du, mac, rlc).
  - id: du-layers-must-not-depend-on-du
    kind: forbidden-edge
    from:
      - include/ocudu/mac/**
      - lib/mac/**
      - include/ocudu/rlc/**
      - lib/rlc/**
      - include/ocudu/f1ap/**
      - lib/f1ap/**
      - include/ocudu/scheduler/**
      - lib/scheduler/**
      - include/ocudu/phy/**
      - lib/phy/**
      - include/ocudu/ofh/**
      - lib/ofh/**
      - include/ocudu/fapi/**
      - include/ocudu/fapi_adaptor/**
      - lib/fapi_adaptor/**
    to:
      - include/ocudu/du/**
      - lib/du/**
    reason: These subsystems sit below the DU manager, which drives them. Including DU headers inverts
      that direction, drags DU configuration types into the cell-processing path and stops each subsystem
      from being built or tested without the DU manager.
  - id: du_high-must-not-depend-on-du_low
    kind: forbidden-edge
    from:
      - include/ocudu/du/du_high/**
      - lib/du/du_high/**
    to:
      - include/ocudu/du/du_low/**
      - lib/du/du_low/**
    reason: The two DU halves meet only through FAPI, and are deployed in separate processes in a split
      setup. A direct include makes DU-high unbuildable without an L1.
  - id: du_low-must-not-depend-on-du_high
    kind: forbidden-edge
    from:
      - include/ocudu/du/du_low/**
      - lib/du/du_low/**
    to:
      - include/ocudu/du/du_high/**
      - lib/du/du_high/**
    reason: The two DU halves meet only through FAPI, and are deployed in separate processes in a split
      setup. A direct include makes DU-low unbuildable without an L2.
  - id: du-must-not-depend-on-cu
    kind: forbidden-edge
    from:
      - include/ocudu/du/**
      - lib/du/**
    to:
      - include/ocudu/cu_cp/**
      - lib/cu_cp/**
      - include/ocudu/cu_up/**
      - lib/cu_up/**
      - include/ocudu/ngap/**
      - lib/ngap/**
      - include/ocudu/e1ap/**
      - lib/e1ap/**
    reason: DU and CU are separate network functions that talk over F1 only. Reaching across the split
      couples the DU to CU internals and to interfaces it does not terminate.
  - id: cu-must-not-depend-on-du
    kind: forbidden-edge
    from:
      - include/ocudu/cu_cp/**
      - lib/cu_cp/**
      - include/ocudu/cu_up/**
      - lib/cu_up/**
    to:
      - include/ocudu/du/**
      - lib/du/**
      - include/ocudu/mac/**
      - lib/mac/**
      - include/ocudu/scheduler/**
      - lib/scheduler/**
      - include/ocudu/phy/**
      - lib/phy/**
    reason: DU and CU are separate network functions that talk over F1 only. The CU must not see DU-side
      layers, which exist only below the split.
  - id: cu_cp-must-not-depend-on-cu_up
    kind: forbidden-edge
    from:
      - include/ocudu/cu_cp/**
      - lib/cu_cp/**
    to:
      - include/ocudu/cu_up/**
      - lib/cu_up/**
    reason: CU-CP and CU-UP are separate network functions that talk over E1 only, and may run in different
      processes.
  - id: cu_up-must-not-depend-on-cu_cp
    kind: forbidden-edge
    from:
      - include/ocudu/cu_up/**
      - lib/cu_up/**
    to:
      - include/ocudu/cu_cp/**
      - lib/cu_cp/**
    reason: CU-CP and CU-UP are separate network functions that talk over E1 only, and may run in different
      processes.
  - id: user-plane-must-not-depend-on-control-plane
    kind: forbidden-edge
    from:
      - include/ocudu/rlc/**
      - lib/rlc/**
      - include/ocudu/pdcp/**
      - lib/pdcp/**
      - include/ocudu/sdap/**
      - lib/sdap/**
      - include/ocudu/gtpu/**
      - lib/gtpu/**
      - include/ocudu/f1u/**
      - lib/f1u/**
    to:
      - include/ocudu/rrc/**
      - lib/rrc/**
      - include/ocudu/cu_cp/**
      - lib/cu_cp/**
      - include/ocudu/cu_up/**
      - lib/cu_up/**
      - include/ocudu/ngap/**
      - lib/ngap/**
    reason: User-plane bearer processing is configured by the control plane, never the other way round.
      Including control-plane headers puts signalling types on the per-packet path.
  - id: rlc-must-not-depend-on-adjacent-layers
    kind: forbidden-edge
    from:
      - include/ocudu/rlc/**
      - lib/rlc/**
    to:
      - include/ocudu/mac/**
      - lib/mac/**
      - include/ocudu/pdcp/**
      - lib/pdcp/**
    reason: RLC exchanges SDUs with MAC and PDCP through interfaces it defines itself, so it must not
      see either neighbour's types.
  - id: pdcp-must-not-depend-on-adjacent-layers
    kind: forbidden-edge
    from:
      - include/ocudu/pdcp/**
      - lib/pdcp/**
    to:
      - include/ocudu/rlc/**
      - lib/rlc/**
      - include/ocudu/sdap/**
      - lib/sdap/**
    reason: PDCP exchanges SDUs with RLC and SDAP through interfaces it defines itself, so it must not
      see either neighbour's types.
  - id: phy-must-not-depend-on-l2
    kind: forbidden-edge
    from:
      - include/ocudu/phy/**
      - lib/phy/**
    to:
      - include/ocudu/mac/**
      - lib/mac/**
      - include/ocudu/scheduler/**
      - lib/scheduler/**
      - include/ocudu/fapi/**
      - include/ocudu/fapi_adaptor/**
      - lib/fapi_adaptor/**
      - include/ocudu/ofh/**
      - lib/ofh/**
    reason: L1 is driven through FAPI and knows nothing above it. Including L2 or adaptor headers inverts
      the split and pulls scheduling types into the sample path.
  - id: l2-must-not-depend-on-phy
    kind: forbidden-edge
    from:
      - include/ocudu/mac/**
      - lib/mac/**
      - include/ocudu/scheduler/**
      - lib/scheduler/**
      - include/ocudu/rlc/**
      - lib/rlc/**
    to:
      - include/ocudu/phy/**
      - lib/phy/**
      - include/ocudu/fapi/**
      - include/ocudu/fapi_adaptor/**
      - lib/fapi_adaptor/**
    reason: L2 is wired to L1 by the application, through interfaces L2 defines itself. Including L1,
      FAPI or adaptor headers ties L2 to one L1 implementation and breaks the split-6 and split-7.2
      deployments.
  - id: fronthaul-must-not-depend-on-l2
    kind: forbidden-edge
    from:
      - include/ocudu/ofh/**
      - lib/ofh/**
      - include/ocudu/fapi/**
    to:
      - include/ocudu/mac/**
      - lib/mac/**
      - include/ocudu/scheduler/**
      - lib/scheduler/**
      - include/ocudu/rlc/**
      - lib/rlc/**
      - include/ocudu/pdcp/**
      - lib/pdcp/**
      - include/ocudu/fapi_adaptor/**
      - lib/fapi_adaptor/**
    reason: The fronthaul and FAPI interfaces carry L1 data only. Including L2 or adaptor headers gives
      them knowledge of layers on the far side of the interface they define.
  - id: cu-layers-must-not-depend-on-cu
    kind: forbidden-edge
    from:
      - include/ocudu/ngap/**
      - lib/ngap/**
      - include/ocudu/e1ap/**
      - lib/e1ap/**
      - include/ocudu/f1ap/**
      - lib/f1ap/**
      - include/ocudu/xnap/**
      - lib/xnap/**
      - include/ocudu/nrppa/**
      - lib/nrppa/**
      - include/ocudu/lpp/**
      - lib/lpp/**
      - include/ocudu/rrc/**
      - lib/rrc/**
      - include/ocudu/pdcp/**
      - lib/pdcp/**
      - include/ocudu/sdap/**
      - lib/sdap/**
      - include/ocudu/gtpu/**
      - lib/gtpu/**
      - include/ocudu/f1u/**
      - lib/f1u/**
      - include/ocudu/nru/**
      - lib/nru/**
      - include/ocudu/security/**
      - lib/security/**
    to:
      - include/ocudu/cu_cp/**
      - lib/cu_cp/**
      - include/ocudu/cu_up/**
      - lib/cu_up/**
    reason: These subsystems sit below the CU-CP and CU-UP, which drive them. Including CU headers inverts
      that direction and stops each subsystem from being built or tested without the CU.
    exempt:
      - from: include/ocudu/e1ap/cu_up/e1ap_cu_up.h
        to: include/ocudu/cu_up/cu_up_types.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. E1AP CU-UP interface takes CU-UP types directly.
      - from: include/ocudu/e1ap/cu_up/e1ap_cu_up_bearer_context_update.h
        to: include/ocudu/cu_up/cu_up_types.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. Bearer context update messages carry CU-UP types.
      - from: lib/e1ap/cu_up/e1ap_cu_up_connection_handler.h
        to: include/ocudu/cu_up/cu_up_manager.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. Connection handler calls back into the CU-UP manager.
      - from: lib/e1ap/cu_up/ue_context/e1ap_ue_logger.h
        to: include/ocudu/cu_up/cu_up_types.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. UE logger formats CU-UP identifiers.
      - from: include/ocudu/f1ap/cu_cp/f1ap_cu.h
        to: include/ocudu/cu_cp/cu_cp_ue_messages.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. F1AP CU interface takes CU-CP UE message types directly.
      - from: include/ocudu/rrc/rrc_config.h
        to: include/ocudu/cu_cp/cu_cp_types.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. RRC config embeds CU-CP types.
      - from: include/ocudu/rrc/rrc_ue.h
        to: include/ocudu/cu_cp/cu_cp_ue_messages.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. RRC UE interface takes CU-CP UE message types directly.
      - from: lib/xnap/procedures/xn_handover_asn1_helpers.h
        to: include/ocudu/cu_cp/cu_cp_cho_types.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. Xn handover helpers convert CU-CP conditional handover types.
      - from: lib/xnap/procedures/xnap_source_handover_preparation_procedure.cpp
        to: include/ocudu/cu_cp/cu_cp_cho_types.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. Handover preparation reads CU-CP conditional handover types.
  - id: rrc-must-not-depend-on-transport-protocols
    kind: forbidden-edge
    from:
      - include/ocudu/rrc/**
      - lib/rrc/**
    to:
      - include/ocudu/ngap/**
      - lib/ngap/**
      - include/ocudu/f1ap/**
      - lib/f1ap/**
      - include/ocudu/e1ap/**
      - lib/e1ap/**
    reason: RRC is the Uu control-plane signalling protocol, terminated in the CU-CP and carried to the
      DU over F1AP. Including transport headers couples message handling to the protocols that carry
      it.
  - id: security-must-not-depend-on-upper-layers
    kind: forbidden-edge
    from:
      - include/ocudu/security/**
      - lib/security/**
    to:
      - include/ocudu/rrc/**
      - lib/rrc/**
      - include/ocudu/pdcp/**
      - lib/pdcp/**
      - include/ocudu/cu_cp/**
      - lib/cu_cp/**
      - include/ocudu/cu_up/**
      - lib/cu_up/**
      - include/ocudu/ngap/**
      - lib/ngap/**
    reason: The security primitives are a leaf utility. Including any of their callers' headers makes
      the ciphering and integrity code impossible to test in isolation.
