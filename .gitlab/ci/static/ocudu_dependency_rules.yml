# Forbidden and allowed include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.
#

version: 1
always_allowed:
  - external/Backward/**
  - external/CLI/**
  - external/TartanLlama/**
  - external/cameron314/**
  - external/fmt/**
  - external/nlohmann/**
  - external/rigtorp/**
  - external/uWebSockets/**
rules:
  # Top level checks (lib, include, apps, tests).
  - id: public-headers-must-not-include-private
    kind: forbidden-edge
    from: include/**
    to: lib/**
    reason: A public header that pulls in an implementation header exports private types to every consumer
      and makes the private header impossible to change without breaking external code.
  - id: subsystem-private-headers-are-private
    kind: peer-isolation
    peers: lib/*
    reason: Subsystems interact only through their public headers under include/ocudu/. Reaching into
      a sibling subsystem's lib/ directory couples to implementation details and blocks refactoring either
      side independently.
  - id: production-must-not-include-tests-or-apps
    kind: forbidden-edge
    from:
      - include/**
      - lib/**
    to:
      - apps/**
      - tests/**
    reason: 'Library code depending on test fixtures or application wiring inverts the build graph: the
      library can no longer be built or shipped on its own.'
  - id: apps-must-not-depend-on-tests
    kind: forbidden-edge
    from: apps/**
    to: tests/**
    reason: 'Shipped applications must not include test fixtures or doubles: it drags test-only code into
      the release build and makes the app unbuildable when testing is disabled.'
  - id: apps-must-use-public-headers
    kind: forbidden-edge
    from: apps/**
    to: lib/**
    reason: Applications compose subsystems through their public interfaces under include/ocudu/. Reaching
      into lib/ pins an app to one subsystem's internal layout.
  - id: adt-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/adt/**
    allow:
      - include/ocudu/adt/**
      - include/ocudu/ocudulog/**
      - include/ocudu/support/**
    reason: Module adt may only depend on the modules listed in allow; anything else breaks its layering
      boundary.
  - id: asn1-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/asn1/**
      - lib/asn1/**
    allow:
      - include/ocudu/asn1/**
      - lib/asn1/**
      - include/ocudu/adt/**
      - include/ocudu/ocudulog/**
      - include/ocudu/support/**
    reason: Module asn1 may only depend on the modules listed in allow; anything else breaks its layering
      boundary.
  - id: ocudulog-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/ocudulog/**
      - lib/ocudulog/**
    allow:
      - include/ocudu/ocudulog/**
      - lib/ocudulog/**
    reason: Module ocudulog may only depend on the modules listed in allow; anything else breaks its layering
      boundary.
  - id: ran-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/ran/**
      - lib/ran/**
    allow:
      - include/ocudu/ran/**
      - lib/ran/**
      - include/ocudu/adt/**
      - include/ocudu/ocudulog/**
      - include/ocudu/ocuduvec/**
      - include/ocudu/support/**
    reason: Module ran may only depend on the modules listed in allow; anything else breaks its layering
      boundary.
    exempt:
      - from: include/ocudu/ran/cu_types.h
        to: include/ocudu/sdap/sdap_config.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. QoS flow types in ran/ carry
          an SDAP config field; splitting it out needs a shared QoS header.
      - from: include/ocudu/ran/inter_cu_handover_messages.h
        to: include/ocudu/security/security.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. Handover request messages embed
          the security context; moving it needs a ran-level security type.
      - from: include/ocudu/ran/pdcch/search_space.h
        to: include/ocudu/scheduler/sched_consts.h
        reason: Tracked by https://gitlab.com/ocudu/ocudu/-/issues/39. Search space uses a scheduler
          constant that belongs in ran/.
  - id: public-headers-must-not-use-relative-includes
    kind: no-relative-includes
    from: include/**
    reason: A public header using a relative '..' include ties its resolution to its own location in the
      tree, rather than to the stable public path other code depends on.
  - id: support-allowed-includes
    kind: allowed-edge
    from:
      - include/ocudu/support/**
      - lib/support/**
    allow:
      - include/ocudu/support/**
      - lib/support/**
      - include/ocudu/adt/**
      - include/ocudu/ocudulog/**
      - include/ocudu/ocuduvec/**
    reason: Module support may only depend on the modules listed in allow; anything else breaks its layering
      boundary.
  # Per-component checks (e.g. du, mac, rlc).
  - id: mac-must-not-depend-on-du
    kind: forbidden-edge
    from:
      - lib/mac/**
      - include/ocudu/mac/**
    to:
      - include/ocudu/du/**
      - lib/du/**
    reason: MAC sits below the DU manager. Including DU headers inverts the layering and drags DU configuration
      types into the cell-processing path.
  - id: rlc-must-not-depend-on-du
    kind: forbidden-edge
    from:
      - lib/rlc/**
      - include/ocudu/rlc/**
    to:
      - include/ocudu/du/**
      - lib/du/**
    reason: RLC sits below the DU manager. Including DU headers inverts the layering and couples per-bearer
      processing to DU-level configuration types.
  - id: f1ap-must-not-depend-on-du
    kind: forbidden-edge
    from:
      - lib/f1ap/**
      - include/ocudu/f1ap/**
    to:
      - include/ocudu/du/**
      - lib/du/**
    reason: F1AP is a transport-facing subsystem driven by the DU manager, not a consumer of it. Including
      DU headers inverts that direction and prevents F1AP from being built or tested without the DU manager.
