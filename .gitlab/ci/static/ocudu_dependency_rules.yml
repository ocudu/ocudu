# Forbidden include dependencies for the OCUDU C++ tree, checked by
# check_dependency_rules.py against a tree from gen_dependency_tree.py.
#
# Every rule here is green on the tree it was ported against. Never land a
# rule that is red without `exempt` entries carrying issue links.

version: 1

rules:
  - id: mac-must-not-depend-on-du
    from:
      - "lib/mac/**"
      - "include/ocudu/mac/**"
    to:
      - "include/ocudu/du/**"
      - "lib/du/**"
    reason: >
      MAC sits below the DU manager. Including DU headers inverts the layering
      and drags DU configuration types into the cell-processing path.

  - id: rlc-must-not-depend-on-du
    from:
      - "lib/rlc/**"
      - "include/ocudu/rlc/**"
    to:
      - "include/ocudu/du/**"
      - "lib/du/**"
    reason: >
      RLC sits below the DU manager. Including DU headers inverts the layering
      and couples per-bearer processing to DU-level configuration types.

  - id: f1ap-must-not-depend-on-du
    from:
      - "lib/f1ap/**"
      - "include/ocudu/f1ap/**"
    to:
      - "include/ocudu/du/**"
      - "lib/du/**"
    reason: >
      F1AP is a transport-facing subsystem driven by the DU manager, not a
      consumer of it. Including DU headers inverts that direction and prevents
      F1AP from being built or tested without the DU manager.

  - id: subsystem-private-headers-are-private
    kind: peer-isolation
    peers: "lib/*"
    reason: >
      Subsystems interact only through their public headers under
      include/ocudu/. Reaching into a sibling subsystem's lib/ directory
      couples to implementation details and blocks refactoring either side
      independently.

  - id: public-headers-must-not-include-private
    from: "include/**"
    to: "lib/**"
    reason: >
      A public header that pulls in an implementation header exports private
      types to every consumer and makes the private header impossible to
      change without breaking external code.

  - id: production-must-not-include-tests-or-apps
    from:
      - "include/**"
      - "lib/**"
    to:
      - "apps/**"
      - "tests/**"
    reason: >
      Library code depending on test fixtures or application wiring inverts
      the build graph: the library can no longer be built or shipped on its
      own.

  - id: apps-must-use-public-headers
    from: "apps/**"
    to: "lib/**"
    reason: >
      Applications compose subsystems through their public interfaces under
      include/ocudu/. Reaching into lib/ pins an app to one subsystem's
      internal layout.

  - id: apps-must-not-depend-on-tests
    from: "apps/**"
    to: "tests/**"
    reason: >
      Shipped applications must not include test fixtures or doubles: it drags
      test-only code into the release build and makes the app unbuildable when
      testing is disabled.
