# Restricts the logical channels of 5QI 9 to grants whose UL HARQ process is in mode B, and gives the cell the mode B
# processes that restriction needs. The SRBs take mode A, so that the signalling does not ride the mode B grants the
# DRBs are served by. Stack on top of gnb.yml:
#   gnb -c ./gnb.yml -c sat.yml -c ntn_du.yml -c ntn_cu.yml -c qos_mode_b.yml

cell_cfg:
  pusch:
    # A bit set to one puts that UL HARQ process in mode B, the leftmost bit being process 0. This leaves the first
    # half of the 32 processes the cell configures in mode A and the second half in mode B.
    harq_mode_b: "0x0000ffff"

qos:
  # Configuring any entry replaces the whole built-in 5QI table rather than adding to it, so this is an example entry
  # to merge into the single QoS configuration of the deployment, which has to carry every 5QI in use.
  -
    # 5QI = 9 e.g Video (Buffered Streaming)
    # PDB = 300ms PER = 10^-6
    five_qi: 9
    pdcp:
      tx:
        sn: 18
        discard_timer: 1500
        status_report_required: false
      rx:
        sn: 18
        t_reordering: 220
        out_of_order_delivery: false
    f1u_cu_up:
      backoff_timer: 5
    f1u_du:
      backoff_timer: 5
    rlc:
      mode: am
      am:
        tx:
          sn: 18
          t-poll-retransmit: 100
          max-retx-threshold: 32
          poll-pdu: 16
          poll-byte: -1
          queue-size: 16384
          queue-bytes: 6172672
        rx:
          sn: 18
          t-reassembly: 20
          t-status-prohibit: 10
    mac:
      allowed_harq_mode: mode_b
